api_key = "${ANTHROPIC_API_KEY}"
default_provider = "anthropic"
default_model = "claude-sonnet-4-20250514"
default_temperature = 0.3

[identity]
format = "aieos"
aieos_path = "../identity.json"

[memory]
backend = "postgres"
auto_save = true
embedding_provider = "none"
vector_weight = 0.7
keyword_weight = 0.3

[storage.provider.config]
provider = "postgres"
db_url = "${DATABASE_URL}"
schema = "public"
table = "agent_memory_ops_commander"
connect_timeout_secs = 15

[gateway]
port = 3001
host = "0.0.0.0"
require_pairing = true
allow_public_bind = true

[autonomy]
level = "full"
workspace_only = true
allowed_commands = [
  "curl", "jq", "cat", "ls", "grep", "echo", "date",
  "psql",
  "node", "npx",
  "/opt/m4-agents/shared-tools/m4-db-query.sh",
  "/opt/m4-agents/shared-tools/m4-escalate.sh",
  "/opt/m4-agents/shared-tools/m4-notify-slack.sh",
  "/opt/m4-agents/shared-tools/m4-dashboard-update.sh"
]
forbidden_paths = ["/etc", "/root", "/proc", "/sys", "~/.ssh"]

[runtime]
kind = "native"

[heartbeat]
enabled = true
interval_minutes = 30

[tunnel]
provider = "cloudflare"

[secrets]
encrypt = true

[browser]
enabled = false

[channels_config.slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"
signing_secret = "${SLACK_SIGNING_SECRET}"
default_channel = "#ops-commander"
allowed_users = ["*"]

[channels_config.whatsapp]
access_token = "${WHATSAPP_ACCESS_TOKEN}"
phone_number_id = "${WHATSAPP_PHONE_NUMBER_ID}"
verify_token = "${WHATSAPP_WEBHOOK_VERIFY_TOKEN}"
allowed_numbers = ["*"]

[channels_config.email]
imap_host = "imap.gmail.com"
imap_user = "ops@m4builds.com"
imap_password = "${EMAIL_PASSWORD}"
smtp_host = "smtp.gmail.com"
smtp_user = "ops@m4builds.com"
smtp_password = "${EMAIL_PASSWORD}"
allowed_senders = ["*"]
