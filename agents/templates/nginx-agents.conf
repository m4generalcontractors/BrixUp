# =============================================================================
# M4 ZeroClaw Agents — Nginx Reverse Proxy Configuration
# =============================================================================
# Install to: /etc/nginx/sites-available/m4-agents.conf
# Enable:     ln -s /etc/nginx/sites-available/m4-agents.conf /etc/nginx/sites-enabled/

# Dashboard
server {
    listen 443 ssl;
    server_name app.m4builds.com;

    ssl_certificate     /etc/ssl/certs/m4builds.com.pem;
    ssl_certificate_key /etc/ssl/private/m4builds.com.key;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Agent Gateways
upstream ops-commander  { server 127.0.0.1:3001; }
upstream marketing      { server 127.0.0.1:3002; }
upstream sales          { server 127.0.0.1:3003; }
upstream estimating     { server 127.0.0.1:3004; }
upstream precon         { server 127.0.0.1:3005; }
upstream pm             { server 127.0.0.1:3006; }
upstream accounting     { server 127.0.0.1:3007; }
upstream documents      { server 127.0.0.1:3008; }
upstream permits        { server 127.0.0.1:3009; }
upstream hr             { server 127.0.0.1:3010; }
upstream investor       { server 127.0.0.1:3011; }

server {
    listen 443 ssl;
    server_name agents.m4builds.com;

    ssl_certificate     /etc/ssl/certs/m4builds.com.pem;
    ssl_certificate_key /etc/ssl/private/m4builds.com.key;

    # WhatsApp webhook → OPS Commander (routes internally)
    location /whatsapp {
        proxy_pass http://ops-commander/whatsapp;
    }

    # Slack events → OPS Commander (routes internally)
    location /webhook/slack {
        proxy_pass http://ops-commander/webhook;
    }

    # Direct agent access (for inter-agent communication)
    location /agent/ops-commander/  { proxy_pass http://ops-commander/; }
    location /agent/marketing/      { proxy_pass http://marketing/; }
    location /agent/sales/          { proxy_pass http://sales/; }
    location /agent/estimating/     { proxy_pass http://estimating/; }
    location /agent/precon/         { proxy_pass http://precon/; }
    location /agent/pm/             { proxy_pass http://pm/; }
    location /agent/accounting/     { proxy_pass http://accounting/; }
    location /agent/documents/      { proxy_pass http://documents/; }
    location /agent/permits/        { proxy_pass http://permits/; }
    location /agent/hr/             { proxy_pass http://hr/; }
    location /agent/investor/       { proxy_pass http://investor/; }

    # Health check endpoint
    location /health {
        proxy_pass http://ops-commander/health;
    }
}
